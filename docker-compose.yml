version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: agri-match-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agri_match
      POSTGRES_PASSWORD: agri_match
      POSTGRES_DB: agri_match_ci
      POSTGRES_INITDB_ARGS: |-
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
    volumes:
      - agri_match_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri_match -d agri_match_ci"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - agri-match-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agri-match-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://agri_match:agri_match@db:5432/agri_match_ci
      JWT_SECRET_KEY: your-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      REFRESH_TOKEN_EXPIRATION_DAYS: 7
      FRONTEND_ORIGIN: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      BACKEND_URL: http://backend:8000
      AI_PROVIDER: anthropic
      AI_API_KEY: ${AI_API_KEY:-}
      UPLOAD_DIR: uploads
      STORAGE_BACKEND: local
      MAX_UPLOAD_SIZE: 5242880
      ALLOWED_EXTENSIONS: jpg,jpeg,png,gif,webp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@agri-match.ci}
      PAYMENT_PROVIDER_MODE: simulation
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_WEBHOOK_HMAC_SECRET: ${PAYMENT_WEBHOOK_HMAC_SECRET:-}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      LOG_LEVEL: INFO
    volumes:
      - agri_match_uploads:/app/uploads
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agri-match-network
    command: |
      bash -c "
        alembic upgrade head && 
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_APP_NAME: Agri-Match CI
    container_name: agri-match-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_APP_NAME: Agri-Match CI
      NEXT_PUBLIC_APP_DESCRIPTION: Plateforme agricole intelligente
      NODE_ENV: development
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - agri-match-network

  # Redis (Cache optionnel)
  redis:
    image: redis:7-alpine
    container_name: agri-match-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - agri_match_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agri-match-network
    profiles:
      - with-redis

volumes:
  agri_match_db_data:
    driver: local
  agri_match_uploads:
    driver: local
  agri_match_redis_data:
    driver: local

networks:
  agri-match-network:
    driver: bridge
